name: Update module catalog

on:
  pull_request:
  schedule:
    # Hourly. GitHub may delay the schedule; repository_dispatch and workflow_dispatch cover immediate runs.
    - cron: "23 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [module-released]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-module-catalog
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm ci

      - name: Test catalog sync
        run: npm test

  sync:
    needs: test
    # Only the default branch. A dispatch on the schema v3 pull request must not
    # force-push chore/sync-module-releases and open a pull request into main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install sync dependencies
        run: npm ci

      - name: Refresh catalog.json from published module releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-catalog.mjs --report /tmp/sync-report.json

      - name: Validate refreshed catalog
        run: |
          node --input-type=module -e "
          import { readFileSync } from 'node:fs';
          import { validateCatalog } from './scripts/update-catalog.mjs';
          const schema = JSON.parse(readFileSync('catalog.schema.json', 'utf8'));
          const catalog = JSON.parse(readFileSync('catalog.json', 'utf8'));
          validateCatalog(catalog, schema);
          "

      - name: Open, auto-merge, and deploy catalog sync pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- catalog.json; then
            echo "Catalog already matches the latest published module releases."
            exit 0
          fi

          git fetch origin main
          base_schema="$(git show origin/main:catalog.json | jq -r '.schemaVersion')"
          head_schema="$(jq -r '.schemaVersion' catalog.json)"
          if [ "$base_schema" != "$head_schema" ]; then
            echo "Refusing to open a sync pull request that changes schemaVersion ${base_schema} -> ${head_schema}."
            echo "Schema version 3 ships with the HamBench release, not the hourly catalog sync."
            exit 1
          fi

          branch="chore/sync-module-releases"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add catalog.json
          git commit -m "chore: sync radio module releases"
          git push --force origin "HEAD:${branch}"

          body="$(python3 - << 'PY'
          import json
          report = json.load(open("/tmp/sync-report.json"))
          lines = [
              "Automated catalog sync from the latest published GitHub release of each module.",
              "",
          ]
          for change in report["changes"]:
              lines.append(f"- `{change['id']}`: {change['action']} {change['from']} -> {change['to']}")
          lines.extend([
              "",
              "Opened by the Update module catalog workflow. It enables auto-merge (squash, delete branch) after validation in the same workflow run.",
          ])
          print("\n".join(lines))
          PY
          )"

          existing="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "chore: sync radio module releases" --body "$body"
            pr_number="$existing"
          else
            pr_url="$(gh pr create --base main --head "$branch" --title "chore: sync radio module releases" --body "$body")"
            pr_number="${pr_url##*/}"
          fi

          echo "Merging catalog sync pull request #${pr_number} (squash, delete branch)."
          if ! gh pr merge "$pr_number" --auto --squash --delete-branch; then
            echo "Auto-merge failed (mergeable PRs with no required checks often need a direct merge); retrying without --auto."
            gh pr merge "$pr_number" --squash --delete-branch
          fi

          echo "Waiting for pull request #${pr_number} to merge..."
          state=""
          for _ in $(seq 1 60); do
            state="$(gh pr view "$pr_number" --json state --jq '.state')"
            if [ "$state" = "MERGED" ]; then
              break
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "Catalog sync pull request #${pr_number} closed without merging."
              exit 1
            fi
            sleep 10
          done
          if [ "$state" != "MERGED" ]; then
            echo "Timed out waiting for catalog sync pull request #${pr_number} to merge."
            exit 1
          fi

          echo "Dispatching Deploy catalog on main (GITHUB_TOKEN merges do not run push workflows)."
          gh workflow run "Deploy catalog" --ref main
